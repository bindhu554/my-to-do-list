<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>To-Do Web App</title>

 
    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #312e81
                );

            color: white;

            padding: 30px 15px;

        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 100%;

            max-width: 1000px;

            margin: auto;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header h1 {

            font-size: 40px;

            margin-bottom: 8px;

        }


        .header p {

            color: #94a3b8;

            font-size: 15px;

        }


        /* =========================================
           STATISTICS
        ========================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .stat-card {

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 15px;

            padding: 18px;

            text-align: center;

        }


        .stat-number {

            display: block;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .stat-label {

            color: #94a3b8;

            font-size: 13px;

        }


        .total {

            color: #06b6d4;

        }


        .completed {

            color: #10b981;

        }


        .pending {

            color: #f59e0b;

        }


        /* =========================================
           ADD TASK CARD
        ========================================= */

        .task-form {

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 20px;

        }


        .form-title {

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 18px;

        }


        .input-row {

            display: grid;

            grid-template-columns:
                1fr auto;

            gap: 10px;

            margin-bottom: 12px;

        }


        input,
        select {

            width: 100%;

            padding: 14px;

            border: 1px solid #475569;

            border-radius: 10px;

            background: #0f172a;

            color: white;

            outline: none;

            font-size: 14px;

        }


        input:focus,
        select:focus {

            border-color: #6366f1;

        }


        .details-row {

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 10px;

        }


        .add-btn {

            border: none;

            padding: 14px 22px;

            background: #6366f1;

            color: white;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .add-btn:hover {

            background: #4f46e5;

            transform: translateY(-2px);

        }


        /* =========================================
           TOOLBAR
        ========================================= */

        .toolbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;

        }


        .search-box {

            flex: 1;

            min-width: 200px;

        }


        .filter-buttons {

            display: flex;

            gap: 8px;

        }


        .filter-btn {

            border: none;

            padding: 10px 15px;

            border-radius: 9px;

            background: #334155;

            color: white;

            cursor: pointer;

            font-size: 13px;

        }


        .filter-btn.active {

            background: #6366f1;

        }


        /* =========================================
           TASK LIST
        ========================================= */

        .task-list {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .task {

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 15px;

            padding: 18px;

            display: flex;

            align-items: center;

            gap: 15px;

            transition: 0.3s;

        }


        .task:hover {

            transform: translateY(-2px);

            background:
                rgba(255,255,255,0.11);

        }


        /* CHECKBOX */

        .check {

            width: 24px;

            height: 24px;

            min-width: 24px;

            border: 2px solid #64748b;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            transition: 0.3s;

        }


        .check.checked {

            background: #10b981;

            border-color: #10b981;

        }


        .check.checked::after {

            content: "✓";

            font-size: 14px;

            font-weight: bold;

        }


        /* TASK CONTENT */

        .task-content {

            flex: 1;

            min-width: 0;

        }


        .task-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 7px;

            word-wrap: break-word;

        }


        .task.completed-task
        .task-title {

            text-decoration: line-through;

            color: #64748b;

        }


        .task-info {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            color: #94a3b8;

            font-size: 12px;

        }


        .priority {

            padding: 4px 8px;

            border-radius: 5px;

            font-size: 11px;

            font-weight: bold;

        }


        .high {

            background:
                rgba(239,68,68,0.2);

            color: #f87171;

        }


        .medium {

            background:
                rgba(245,158,11,0.2);

            color: #fbbf24;

        }


        .low {

            background:
                rgba(16,185,129,0.2);

            color: #34d399;

        }


        /* ACTION BUTTONS */

        .actions {

            display: flex;

            gap: 7px;

        }


        .action-btn {

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 9px;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;

        }


        .action-btn:hover {

            transform: scale(1.08);

        }


        .edit-btn {

            background: #6366f1;

        }


        .delete-btn {

            background: #ef4444;

        }


        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            background:
                rgba(255,255,255,0.05);

            border-radius: 15px;

        }


        .empty-icon {

            font-size: 55px;

            margin-bottom: 12px;

        }


        .empty h3 {

            margin-bottom: 7px;

        }


        .empty p {

            color: #94a3b8;

            font-size: 14px;

        }


        /* =========================================
           EDIT MODAL
        ========================================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.7);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 1000;

        }


        .modal.show {

            display: flex;

        }


        .modal-box {

            width: 100%;

            max-width: 450px;

            background: #1e293b;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.5);

        }


        .modal-title {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 20px;

        }


        .modal-field {

            margin-bottom: 15px;

        }


        .modal-field label {

            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 13px;

        }


        .modal-buttons {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;

        }


        .modal-btn {

            border: none;

            padding: 11px 20px;

            border-radius: 9px;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        .cancel-btn {

            background: #475569;

        }


        .save-btn {

            background: #10b981;

        }


        /* =========================================
           CLEAR COMPLETED
        ========================================= */

        .bottom-actions {

            display: flex;

            justify-content: flex-end;

            margin-top: 20px;

        }


        .clear-completed {

            border: none;

            background: #475569;

            color: white;

            padding: 10px 16px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 13px;

        }


        .clear-completed:hover {

            background: #64748b;

        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {

            .stats {

                grid-template-columns:
                    1fr;

            }


            .input-row {

                grid-template-columns:
                    1fr;

            }


            .details-row {

                grid-template-columns:
                    1fr;

            }


            .task {

                align-items: flex-start;

            }


            .actions {

                flex-direction: column;

            }

        }


        @media (max-width: 500px) {

            body {

                padding: 20px 10px;

            }


            .header h1 {

                font-size: 30px;

            }


            .task-form {

                padding: 18px;

            }


            .task {

                padding: 14px;

            }


            .toolbar {

                flex-direction: column;

                align-items: stretch;

            }


            .filter-buttons {

                justify-content: center;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <h1>
            📝 My To-Do List
        </h1>

        <p>
            Organize your tasks and stay productive
        </p>

    </div>


    <!-- =====================================
         STATISTICS
    ====================================== -->

    <div class="stats">


        <div class="stat-card">

            <span
                class="stat-number total"
                id="totalTasks">
                0
            </span>

            <span class="stat-label">
                Total Tasks
            </span>

        </div>


        <div class="stat-card">

            <span
                class="stat-number completed"
                id="completedTasks">
                0
            </span>

            <span class="stat-label">
                Completed
            </span>

        </div>


        <div class="stat-card">

            <span
                class="stat-number pending"
                id="pendingTasks">
                0
            </span>

            <span class="stat-label">
                Pending
            </span>

        </div>


    </div>


    <!-- =====================================
         ADD TASK FORM
    ====================================== -->

    <div class="task-form">


        <div class="form-title">

            ➕ Add New Task

        </div>


        <div class="input-row">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?">


            <button
                class="add-btn"
                id="addTaskButton">

                + Add Task

            </button>

        </div>


        <div class="details-row">


            <input
                type="date"
                id="taskDate">


            <input
                type="time"
                id="taskTime">


            <select id="taskPriority">

                <option value="low">
                    🟢 Low Priority
                </option>

                <option value="medium" selected>
                    🟡 Medium Priority
                </option>

                <option value="high">
                    🔴 High Priority
                </option>

            </select>


        </div>

    </div>


    <!-- =====================================
         TOOLBAR
    ====================================== -->

    <div class="toolbar">


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks...">

        </div>


        <div class="filter-buttons">


            <button
                class="filter-btn active"
                data-filter="all">

                All

            </button>


            <button
                class="filter-btn"
                data-filter="pending">

                Pending

            </button>


            <button
                class="filter-btn"
                data-filter="completed">

                Completed

            </button>


        </div>

    </div>


    <!-- =====================================
         TASK LIST
    ====================================== -->

    <div
        class="task-list"
        id="taskList">
    </div>


    <!-- =====================================
         BOTTOM ACTION
    ====================================== -->

    <div class="bottom-actions">

        <button
            class="clear-completed"
            id="clearCompleted">

            🗑 Clear Completed

        </button>

    </div>


</div>


<!-- =========================================
     EDIT MODAL
========================================= -->

<div
    class="modal"
    id="editModal">


    <div class="modal-box">


        <div class="modal-title">

            ✏️ Edit Task

        </div>


        <div class="modal-field">

            <label>
                Task Name
            </label>

            <input
                type="text"
                id="editTaskInput">

        </div>


        <div class="modal-field">

            <label>
                Date
            </label>

            <input
                type="date"
                id="editTaskDate">

        </div>


        <div class="modal-field">

            <label>
                Time
            </label>

            <input
                type="time"
                id="editTaskTime">

        </div>


        <div class="modal-field">

            <label>
                Priority
            </label>

            <select id="editTaskPriority">

                <option value="low">
                    🟢 Low Priority
                </option>

                <option value="medium">
                    🟡 Medium Priority
                </option>

                <option value="high">
                    🔴 High Priority
                </option>

            </select>

        </div>


        <div class="modal-buttons">


            <button
                class="modal-btn cancel-btn"
                id="cancelEdit">

                Cancel

            </button>


            <button
                class="modal-btn save-btn"
                id="saveEdit">

                Save Changes

            </button>


        </div>


    </div>

</div>


<script>


    // =========================================
    // VARIABLES
    // =========================================


    let tasks =
        JSON.parse(
            localStorage.getItem("todoTasks")
        ) || [];


    let currentFilter = "all";


    let editingTaskId = null;


    // =========================================
    // DOM ELEMENTS
    // =========================================


    const taskInput =
        document.getElementById("taskInput");


    const taskDate =
        document.getElementById("taskDate");


    const taskTime =
        document.getElementById("taskTime");


    const taskPriority =
        document.getElementById("taskPriority");


    const addTaskButton =
        document.getElementById("addTaskButton");


    const taskList =
        document.getElementById("taskList");


    const searchInput =
        document.getElementById("searchInput");


    const totalTasks =
        document.getElementById("totalTasks");


    const completedTasks =
        document.getElementById("completedTasks");


    const pendingTasks =
        document.getElementById("pendingTasks");


    const clearCompleted =
        document.getElementById("clearCompleted");


    // Modal elements

    const editModal =
        document.getElementById("editModal");


    const editTaskInput =
        document.getElementById("editTaskInput");


    const editTaskDate =
        document.getElementById("editTaskDate");


    const editTaskTime =
        document.getElementById("editTaskTime");


    const editTaskPriority =
        document.getElementById("editTaskPriority");


    const cancelEdit =
        document.getElementById("cancelEdit");


    const saveEdit =
        document.getElementById("saveEdit");


    // =========================================
    // SAVE TASKS
    // =========================================


    function saveTasks() {

        localStorage.setItem(
            "todoTasks",
            JSON.stringify(tasks)
        );

    }


    // =========================================
    // ADD TASK
    // =========================================


    addTaskButton.addEventListener(
        "click",
        addTask
    );


    taskInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                addTask();

            }

        }
    );


    function addTask() {


        const title =
            taskInput.value.trim();


        if (title === "") {

            alert(
                "Please enter a task."
            );

            taskInput.focus();

            return;

        }


        const newTask = {

            id:
                Date.now(),

            title:
                title,

            date:
                taskDate.value,

            time:
                taskTime.value,

            priority:
                taskPriority.value,

            completed:
                false

        };


        tasks.push(newTask);


        saveTasks();


        clearForm();


        renderTasks();


        taskInput.focus();

    }


    // =========================================
    // CLEAR FORM
    // =========================================


    function clearForm() {

        taskInput.value = "";

        taskDate.value = "";

        taskTime.value = "";

        taskPriority.value = "medium";

    }


    // =========================================
    // RENDER TASKS
    // =========================================


    function renderTasks() {


        taskList.innerHTML = "";


        const searchText =
            searchInput.value
                .toLowerCase()
                .trim();


        let filteredTasks =
            tasks.filter(
                task => {


                    // Search

                    const matchesSearch =
                        task.title
                            .toLowerCase()
                            .includes(
                                searchText
                            );


                    // Filter

                    let matchesFilter =
                        true;


                    if (
                        currentFilter ===
                        "pending"
                    ) {

                        matchesFilter =
                            !task.completed;

                    }


                    if (
                        currentFilter ===
                        "completed"
                    ) {

                        matchesFilter =
                            task.completed;

                    }


                    return (
                        matchesSearch &&
                        matchesFilter
                    );

                }
            );


        // Empty list

        if (
            filteredTasks.length === 0
        ) {

            taskList.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        📋
                    </div>

                    <h3>
                        No tasks found
                    </h3>

                    <p>
                        Add a new task to get started.
                    </p>

                </div>

            `;

            updateStats();

            return;

        }


        // Create tasks

        filteredTasks.forEach(
            task => {

                const taskElement =
                    createTaskElement(task);

                taskList.appendChild(
                    taskElement
                );

            }
        );


        updateStats();

    }


    // =========================================
    // CREATE TASK ELEMENT
    // =========================================


    function createTaskElement(task) {


        const div =
            document.createElement("div");


        div.className =
            "task";


        if (task.completed) {

            div.classList.add(
                "completed-task"
            );

        }


        // Date and time

        let dateTimeText = "";


        if (task.date) {

            dateTimeText +=
                "📅 " +
                formatDate(task.date);

        }


        if (task.time) {

            if (dateTimeText !== "") {

                dateTimeText += " • ";

            }

            dateTimeText +=
                "⏰ " +
                formatTime(task.time);

        }


        if (dateTimeText === "") {

            dateTimeText =
                "No date/time set";

        }


        div.innerHTML = `

            <div
                class="check
                ${task.completed ? "checked" : ""}"
                data-id="${task.id}">
            </div>


            <div class="task-content">

                <div class="task-title">

                    ${escapeHtml(task.title)}

                </div>


                <div class="task-info">

                    <span>
                        ${dateTimeText}
                    </span>

                    <span
                        class="priority ${task.priority}">

                        ${getPriorityText(
                            task.priority
                        )}

                    </span>

                </div>

            </div>


            <div class="actions">

                <button
                    class="action-btn edit-btn"
                    data-id="${task.id}"
                    title="Edit">

                    ✏️

                </button>


                <button
                    class="action-btn delete-btn"
                    data-id="${task.id}"
                    title="Delete">

                    🗑️

                </button>

            </div>

        `;


        // Complete task

        div.querySelector(".check")
            .addEventListener(
                "click",
                function() {

                    toggleTask(
                        task.id
                    );

                }
            );


        // Edit task

        div.querySelector(".edit-btn")
            .addEventListener(
                "click",
                function() {

                    openEditModal(
                        task.id
                    );

                }
            );


        // Delete task

        div.querySelector(".delete-btn")
            .addEventListener(
                "click",
                function() {

                    deleteTask(
                        task.id
                    );

                }
            );


        return div;

    }


    // =========================================
    // TOGGLE COMPLETE
    // =========================================


    function toggleTask(id) {


        const task =
            tasks.find(
                task =>
                    task.id === id
            );


        if (!task) {

            return;

        }


        task.completed =
            !task.completed;


        saveTasks();


        renderTasks();

    }


    // =========================================
    // DELETE TASK
    // =========================================


    function deleteTask(id) {


        const confirmDelete =
            confirm(
                "Are you sure you want to delete this task?"
            );


        if (!confirmDelete) {

            return;

        }


        tasks =
            tasks.filter(
                task =>
                    task.id !== id
            );


        saveTasks();


        renderTasks();

    }


    // =========================================
    // EDIT MODAL
    // =========================================


    function openEditModal(id) {


        const task =
            tasks.find(
                task =>
                    task.id === id
            );


        if (!task) {

            return;

        }


        editingTaskId =
            id;


        editTaskInput.value =
            task.title;


        editTaskDate.value =
            task.date;


        editTaskTime.value =
            task.time;


        editTaskPriority.value =
            task.priority;


        editModal.classList.add(
            "show"
        );

    }


    // =========================================
    // CLOSE EDIT MODAL
    // =========================================


    cancelEdit.addEventListener(
        "click",
        function() {

            closeEditModal();

        }
    );


    function closeEditModal() {

        editModal.classList.remove(
            "show"
        );

        editingTaskId = null;

    }


    // =========================================
    // SAVE EDIT
    // =========================================


    saveEdit.addEventListener(
        "click",
        function() {


            const title =
                editTaskInput.value.trim();


            if (title === "") {

                alert(
                    "Task name cannot be empty."
                );

                return;

            }


            const task =
                tasks.find(
                    task =>
                        task.id ===
                        editingTaskId
                );


            if (!task) {

                return;

            }


            task.title =
                title;


            task.date =
                editTaskDate.value;


            task.time =
                editTaskTime.value;


            task.priority =
                editTaskPriority.value;


            saveTasks();


            closeEditModal();


            renderTasks();

        }
    );


    // =========================================
    // CLOSE MODAL WHEN CLICKING OUTSIDE
    // =========================================


    editModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                editModal
            ) {

                closeEditModal();

            }

        }
    );


    // =========================================
    // SEARCH
    // =========================================


    searchInput.addEventListener(
        "input",
        function() {

            renderTasks();

        }
    );


    // =========================================
    // FILTER BUTTONS
    // =========================================


    document
        .querySelectorAll(".filter-btn")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {


                        document
                            .querySelectorAll(
                                ".filter-btn"
                            )
                            .forEach(
                                btn => {

                                    btn.classList
                                        .remove(
                                            "active"
                                        );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        currentFilter =
                            button.dataset.filter;


                        renderTasks();

                    }
                );

            }
        );


    // =========================================
    // CLEAR COMPLETED
    // =========================================


    clearCompleted.addEventListener(
        "click",
        function() {


            const completedCount =
                tasks.filter(
                    task =>
                        task.completed
                ).length;


            if (
                completedCount === 0
            ) {

                alert(
                    "There are no completed tasks."
                );

                return;

            }


            const confirmClear =
                confirm(
                    "Remove all completed tasks?"
                );


            if (!confirmClear) {

                return;

            }


            tasks =
                tasks.filter(
                    task =>
                        !task.completed
                );


            saveTasks();


            renderTasks();

        }
    );


    // =========================================
    // UPDATE STATISTICS
    // =========================================


    function updateStats() {


        const total =
            tasks.length;


        const completed =
            tasks.filter(
                task =>
                    task.completed
            ).length;


        const pending =
            total - completed;


        totalTasks.textContent =
            total;


        completedTasks.textContent =
            completed;


        pendingTasks.textContent =
            pending;

    }


    // =========================================
    // FORMAT DATE
    // =========================================


    function formatDate(date) {


        const parts =
            date.split("-");


        if (
            parts.length !== 3
        ) {

            return date;

        }


        return `${parts[2]}/${parts[1]}/${parts[0]}`;

    }


    // =========================================
    // FORMAT TIME
    // =========================================


    function formatTime(time) {


        const parts =
            time.split(":");


        if (
            parts.length < 2
        ) {

            return time;

        }


        let hour =
            parseInt(parts[0]);


        const minute =
            parts[1];


        const period =
            hour >= 12
                ? "PM"
                : "AM";


        hour =
            hour % 12 || 12;


        return `${hour}:${minute} ${period}`;

    }


    // =========================================
    // PRIORITY TEXT
    // =========================================


    function getPriorityText(priority) {


        if (
            priority === "high"
        ) {

            return "🔴 HIGH";

        }


        if (
            priority === "medium"
        ) {

            return "🟡 MEDIUM";

        }


        return "🟢 LOW";

    }


    // =========================================
    // HTML SECURITY
    // =========================================


    function escapeHtml(text) {


        const div =
            document.createElement("div");


        div.textContent =
            text;


        return div.innerHTML;

    }


    // =========================================
    // INITIAL LOAD
    // =========================================


    renderTasks();


</script>


</body>
